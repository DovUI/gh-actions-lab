name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for trailing whitespace
        run: |
          if grep -rn ' $' src/ 2>/dev/null; then
            echo "::warning::Found trailing whitespace"
          else
            echo "No trailing whitespace found"
          fi

      - name: Validate JSON files
        run: |
          for f in $(find . -name '*.json' -not -path './.git/*'); do
            echo "Validating $f"
            python3 -c "import json; json.load(open('$f'))"
          done

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          echo "Running tests..."
          ./test.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  matrix-demo:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        greeting: [Hello, Bonjour]
    steps:
      - uses: actions/checkout@v4

      - name: Greet
        run: echo "${{ matrix.greeting }} from ${{ matrix.os }}!"
